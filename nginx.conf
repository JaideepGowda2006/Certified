server {
    listen 80;
    server_name localhost;

    # Gzip compression for production performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static React SPA production build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header X-Served-By "Docker-Nginx-Frontend-Container" always;
        add_header X-Docker-Architecture "Experiment-10-Certified-DevOps" always;
    }

    # Reverse proxy REST API requests to backend container
    location /api/ {
        proxy_pass http://certified-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy Socket.IO WebSocket traffic to backend container
    location /socket.io/ {
        proxy_pass http://certified-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Backend healthcheck proxy
    location /health {
        proxy_pass http://certified-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
