# -------------------------------------------------------------
# Certified - Docker Compose Configuration
# Experiment 10: Docker and DevOps Deployment
# -------------------------------------------------------------

services:
  mongodb:
    image: mongo:7.0
    container_name: certified-mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  certified-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: certified-backend:latest
    container_name: certified-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/truecert}
      - JWT_SECRET=${JWT_SECRET:-certified_docker_devops_secret_key_minimum_32_characters_123456}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,https://hoppscotch.io}
      - DEMO_MODE=${DEMO_MODE:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
