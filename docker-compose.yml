# -------------------------------------------------------------
# Certified - Docker Compose Configuration
# Experiment 10: Docker and DevOps Deployment
# -------------------------------------------------------------

services:
  mongodb:
    image: mongo:7.0
    container_name: certified-mongo
    hostname: mongodb
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    networks:
      certified-net:
        aliases:
          - mongodb
          - certified-mongo

  certified-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: certified-backend:latest
    container_name: certified-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/truecert?directConnection=true}
      - JWT_SECRET=${JWT_SECRET:-certified_docker_devops_secret_key_minimum_32_characters_123456}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,https://hoppscotch.io}
      - DEMO_MODE=true
    networks:
      - certified-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  certified-net:
    driver: bridge

volumes:
  mongodb_data:
